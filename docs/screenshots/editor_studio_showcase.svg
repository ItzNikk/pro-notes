<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D111A" />
      <stop offset="100%" stop-color="#171E2E" />
    </linearGradient>
    <linearGradient id="toolbarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A2234" />
      <stop offset="100%" stop-color="#20293E" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Background -->
  <rect width="1200" height="680" rx="22" fill="url(#bgGrad)" />

  <!-- Top Document Tab Bar -->
  <rect x="20" y="18" width="1160" height="48" rx="12" fill="#151C28" stroke="#283246" stroke-width="1.5" />
  <circle cx="48" cy="42" r="10" fill="#3B82F6" />
  <text x="68" y="47" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="bold">Quantum Mechanics Lecture • Page 1/4</text>
  <rect x="360" y="26" width="190" height="32" rx="8" fill="#1F293D" />
  <text x="378" y="47" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="bold">Architecture Sketchbook</text>
  <rect x="975" y="27" width="185" height="30" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
  <text x="992" y="46" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="bold">3x Tap: Cinema Showcase</text>

  <!-- Sub-Toolbar with 7 Studio Pens, Shapes, Lasso, Tape, Ruler & Live Color Swatches -->
  <rect x="140" y="76" width="920" height="54" rx="16" fill="url(#toolbarGrad)" stroke="#334155" stroke-width="1.5" />
  <!-- Tool Pills -->
  <rect x="158" y="85" width="76" height="36" rx="10" fill="#2563EB" />
  <text x="175" y="108" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">7 Pens</text>

  <rect x="244" y="85" width="84" height="36" rx="10" fill="#1E293B" />
  <text x="256" y="108" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="bold">Highlighter</text>

  <rect x="338" y="85" width="76" height="36" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
  <text x="353" y="108" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="bold">Shapes</text>

  <rect x="424" y="85" width="70" height="36" rx="10" fill="#1E293B" />
  <text x="441" y="108" fill="#A855F7" font-family="sans-serif" font-size="12" font-weight="bold">Lasso</text>

  <rect x="504" y="85" width="68" height="36" rx="10" fill="#1E293B" />
  <text x="522" y="108" fill="#F59E0B" font-family="sans-serif" font-size="12" font-weight="bold">Tape</text>

  <rect x="582" y="85" width="68" height="36" rx="10" fill="#1E293B" />
  <text x="600" y="108" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="bold">Ruler</text>

  <rect x="660" y="85" width="68" height="36" rx="10" fill="#1E293B" />
  <text x="678" y="108" fill="#EF4444" font-family="sans-serif" font-size="12" font-weight="bold">Laser</text>

  <!-- Live Color Swatches -->
  <circle cx="766" cy="103" r="11" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="798" cy="103" r="11" fill="#F43F5E" />
  <circle cx="830" cy="103" r="11" fill="#10B981" />
  <circle cx="862" cy="103" r="11" fill="#F59E0B" />
  <circle cx="894" cy="103" r="11" fill="#A855F7" />
  <rect x="924" y="88" width="118" height="30" rx="15" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" />
  <text x="942" y="107" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="bold">S Pen • 0.85px</text>

  <!-- Notebook Paper Canvas -->
  <rect x="90" y="146" width="1020" height="510" rx="16" fill="#FCFBF7" stroke="#CBD5E1" stroke-width="2" />

  <!-- Subtle Grid Lines -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="90" y1="206" x2="1110" y2="206" />
    <line x1="90" y1="266" x2="1110" y2="266" />
    <line x1="90" y1="326" x2="1110" y2="326" />
    <line x1="90" y1="386" x2="1110" y2="386" />
    <line x1="90" y1="446" x2="1110" y2="446" />
    <line x1="90" y1="506" x2="1110" y2="506" />
    <line x1="90" y1="566" x2="1110" y2="566" />
    <line x1="210" y1="146" x2="210" y2="656" />
    <line x1="330" y1="146" x2="330" y2="656" />
    <line x1="450" y1="146" x2="450" y2="656" />
    <line x1="570" y1="146" x2="570" y2="656" />
    <line x1="690" y1="146" x2="690" y2="656" />
    <line x1="810" y1="146" x2="810" y2="656" />
    <line x1="930" y1="146" x2="930" y2="656" />
  </g>

  <!-- Snapped Perfect Circle & Polygon Showcase -->
  <circle cx="280" cy="310" r="88" fill="#3B82F6" fill-opacity="0.12" stroke="#2563EB" stroke-width="4" />
  <text x="218" y="315" fill="#1E40AF" font-family="sans-serif" font-size="14" font-weight="bold">Hold-Snapped Circle</text>
  <rect x="205" y="195" width="150" height="24" rx="12" fill="#1E293B" />
  <text x="219" y="211" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="bold">✓ Auto-Snap Circle</text>

  <!-- Right-Angle & Bracket Snap Showcase -->
  <polyline points="450,245 530,295 450,345" fill="none" stroke="#8B5CF6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="620,245 540,295 620,345" fill="none" stroke="#EC4899" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="462" y="382" fill="#475569" font-family="sans-serif" font-size="12" font-weight="bold">Angle Brackets &gt; &lt;</text>

  <!-- Neon Glow Pen & Calligraphy Showcase -->
  <path d="M 150 490 Q 250 420, 350 490 T 550 485" fill="none" stroke="url(#neonGlow)" stroke-width="7" stroke-linecap="round" filter="url(#glow)" />
  <text x="155" y="532" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="bold">Neon Glow &amp; 45° Calligraphy Studio Pens</text>

  <!-- Study Tape Flashcard Occlusion Strip -->
  <rect x="150" y="560" width="380" height="44" rx="10" fill="#F59E0B" stroke="#D97706" stroke-width="2" />
  <text x="178" y="587" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">TAP STUDY TAPE TO REVEAL FORMULA</text>

  <!-- Interactive Rotatable Ruler Overlay -->
  <g transform="translate(650, 445) rotate(-14)">
    <rect x="0" y="0" width="380" height="58" rx="10" fill="#0F172A" fill-opacity="0.88" stroke="#38BDF8" stroke-width="2" />
    <text x="145" y="36" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="bold">RULER • -14.0°</text>
  </g>

  <!-- Redesigned Interactive Tour HUD Card (Bottom-Right) -->
  <rect x="680" y="166" width="405" height="220" rx="18" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
  <text x="702" y="196" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="bold">INTERACTIVE STUDIO TOUR • STEP 2 OF 6</text>
  <text x="702" y="222" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">Continuous Auto-Snap Shapes (&gt;, &lt;, O)</text>
  <text x="702" y="246" fill="#94A3B8" font-family="sans-serif" font-size="12">Draw any circle, polygon, arrow, or angle bracket</text>
  <text x="702" y="264" fill="#94A3B8" font-family="sans-serif" font-size="12">and hold 320ms to snap seamlessly without interruption.</text>
  <rect x="702" y="286" width="155" height="34" rx="10" fill="#059669" />
  <text x="720" y="308" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">✨ Auto-Demo Step</text>
  <rect x="868" y="286" width="110" height="34" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
  <text x="886" y="308" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="bold">🎬 Video PiP</text>
  <rect x="702" y="334" width="360" height="34" rx="10" fill="#2563EB" />
  <text x="822" y="356" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">Next Step →</text>
</svg>
